<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #d1d5db;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 320px;
            background: #111827;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .calculator__display {
            min-height: 80px;
            padding: 20px;
            background: #000;
            color: #fff;
            font-size: 2rem;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-break: break-all;
        }

        .calculator__keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: #374151;
        }

        button {
            border: none;
            padding: 22px 10px;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            background: #e5e7eb;
            color: #111827;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        button:hover {
            opacity: 0.96;
        }

        button:active,
        .is-depressed {
            transform: translateY(1px);
            opacity: 0.9;
        }

        .key--operator {
            background: #f59e0b;
            color: #fff;
        }

        .key--clear {
            background: #ef4444;
            color: #fff;
        }

        .key--equal {
            background: #10b981;
            color: #fff;
            grid-column: span 1;
        }

        .key--zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="calculator__display">0</div>
        <div class="calculator__keys">
            <button class="key--clear" data-action="clear">AC</button>
            <button class="key--operator" data-action="divide">÷</button>
            <button class="key--operator" data-action="multiply">×</button>
            <button class="key--operator" data-action="subtract">−</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="key--operator" data-action="add">+</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="key--equal" data-action="calculate">=</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="key--zero">0</button>
            <button data-action="decimal">.</button>
        </div>
    </div>

    <script>
        const calculator = document.querySelector('.calculator');
        const display = document.querySelector('.calculator__display');
        const keys = calculator.querySelector('.calculator__keys');

        let firstValue = null;
        let operator = null;
        let previousKeyType = null;

        function calculate(firstNum, operatorValue, secondNum) {
            const first = parseFloat(firstNum);
            const second = parseFloat(secondNum);

            if (operatorValue === 'add') return first + second;
            if (operatorValue === 'subtract') return first - second;
            if (operatorValue === 'multiply') return first * second;
            if (operatorValue === 'divide') return second === 0 ? 'Error' : first / second;
            return secondNum;
        }

        keys.addEventListener('click', (event) => {
            const key = event.target;

            if (!key.matches('button')) return;

            const action = key.dataset.action;
            const keyContent = key.textContent;
            const displayedNum = display.textContent;

            Array.from(key.parentNode.children).forEach((button) => {
                button.classList.remove('is-depressed');
            });

            if (!action) {
                if (displayedNum === '0' || previousKeyType === 'operator' || previousKeyType === 'calculate') {
                    display.textContent = keyContent;
                } else {
                    display.textContent = displayedNum + keyContent;
                }
                previousKeyType = 'number';
                return;
            }

            if (action === 'decimal') {
                if (!displayedNum.includes('.')) {
                    display.textContent = displayedNum + '.';
                } else if (previousKeyType === 'operator' || previousKeyType === 'calculate') {
                    display.textContent = '0.';
                }
                previousKeyType = 'decimal';
                return;
            }

            if (action === 'clear') {
                display.textContent = '0';
                firstValue = null;
                operator = null;
                previousKeyType = 'clear';
                return;
            }

            if (action === 'add' || action === 'subtract' || action === 'multiply' || action === 'divide') {
                if (firstValue && operator && previousKeyType !== 'operator' && previousKeyType !== 'calculate') {
                    const result = calculate(firstValue, operator, displayedNum);
                    display.textContent = result;
                    firstValue = result;
                } else {
                    firstValue = displayedNum;
                }

                key.classList.add('is-depressed');
                operator = action;
                previousKeyType = 'operator';
                return;
            }

            if (action === 'calculate') {
                if (firstValue && operator) {
                    const result = calculate(firstValue, operator, displayedNum);
                    display.textContent = result;
                    firstValue = result;
                }

                previousKeyType = 'calculate';
            }
        });
    </script>
</body>
</html>
